<!DOCTYPE html>
<html lang="zh-TW">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="/static/styles/attraction.css?v=1.2">
        <link rel="stylesheet" href="/static/styles/dialog.css?v=1.0">
        <title>台北一日遊</title>
    </head>
    <body>
        <header class="header">
            <div class="header__inner">
                <a class="logo" href="/">台北一日遊</a>
                <nav class="nav">
                    <a class="nav__link" href="/booking">預定行程</a>
                    <a class="nav__link" id="auth-entry" href="#">登入/註冊</a>
                </nav>
            </div>
        </header>

        <main class="attraction">
            <section class="attraction__top">
                <div class="slideshow">
                    <div class="slideshow__viewport">
                        <img class="slideshow__image" id="slideshow-image" alt="">
                        <button class="slideshow__arrow slideshow__arrow--left" id="slideshow-prev" type="button" aria-label="上一張"></button>
                        <button class="slideshow__arrow slideshow__arrow--right" id="slideshow-next" type="button" aria-label="下一張"></button>
                        <div class="slideshow__indicators" id="slideshow-indicators"></div>
                    </div>
                </div>

                <div class="profile">
                    <h1 class="profile__name" id="attraction-name"></h1>
                    <p class="profile__subtitle" id="attraction-subtitle"></p>

                    <div class="booking">
                        <h2 class="booking__title">訂購導覽行程</h2>
                        <p class="booking__desc">以此景點為中心的一日行程，帶您探索城市角落故事</p>

                        <div class="booking__field">
                            <label class="booking__label" for="booking-date">選擇日期：</label>
                            <input class="booking__date" id="booking-date" type="date">
                        </div>

                        <div class="booking__field">
                            <span class="booking__label">選擇時間：</span>
                            <div class="booking__times">
                                <label class="radio">
                                    <input class="radio__input" type="radio" name="time" value="morning" checked>
                                    <span class="radio__text">上半天</span>
                                </label>
                                <label class="radio">
                                    <input class="radio__input" type="radio" name="time" value="afternoon">
                                    <span class="radio__text">下半天</span>
                                </label>
                            </div>
                        </div>

                        <div class="booking__field">
                            <span class="booking__label">導覽費用：</span>
                            <span class="booking__price" id="booking-price">新台幣 2000 元</span>
                        </div>

                        <button class="booking__submit" type="button">開始預約行程</button>
                    </div>
                </div>
            </section>

            <hr class="attraction__separator">

            <section class="info">
                <p class="info__description" id="attraction-description"></p>
                <h2 class="info__heading">景點地址：</h2>
                <p class="info__text" id="attraction-address"></p>
                <h2 class="info__heading">交通方式：</h2>
                <p class="info__text" id="attraction-transport"></p>
            </section>
        </main>

        <footer class="footer">
            <p class="footer__text">COPYRIGHT © 2021 台北一日遊</p>
        </footer>

        <div class="dialog-overlay" id="auth-dialog">
            <div class="dialog-overlay__backdrop" data-dialog-close></div>
            <div class="dialog" role="dialog" aria-modal="true">
                <div class="dialog__bar"></div>
                <button class="dialog__close" type="button" data-dialog-close aria-label="關閉">✕</button>

                <div class="dialog__main">
                    <div id="signin-panel">
                        <h2 class="dialog__title">登入會員帳號</h2>
                        <div class="dialog__form">
                            <input class="dialog__input" id="signin-email" type="email" placeholder="輸入電子信箱" autocomplete="email">
                            <input class="dialog__input" id="signin-password" type="password" placeholder="輸入密碼" autocomplete="current-password">
                            <button class="dialog__submit" id="signin-submit" type="button">登入帳戶</button>
                        </div>
                        <p class="dialog__message" id="signin-message" hidden></p>
                        <p class="dialog__switch">還沒有帳戶？<span class="dialog__switch-link" id="to-signup">點此註冊</span></p>
                    </div>

                    <div id="signup-panel" hidden>
                        <h2 class="dialog__title">註冊會員帳號</h2>
                        <div class="dialog__form">
                            <input class="dialog__input" id="signup-name" type="text" placeholder="輸入姓名" autocomplete="name">
                            <input class="dialog__input" id="signup-email" type="email" placeholder="輸入電子郵件" autocomplete="email">
                            <input class="dialog__input" id="signup-password" type="password" placeholder="輸入密碼" autocomplete="new-password">
                            <button class="dialog__submit" id="signup-submit" type="button">註冊新帳戶</button>
                        </div>
                        <p class="dialog__message" id="signup-message" hidden></p>
                        <p class="dialog__switch">已經有帳戶了？<span class="dialog__switch-link" id="to-signin">點此登入</span></p>
                    </div>
                </div>
            </div>
        </div>
        <script src="/static/scripts/auth.js?v=1.0"></script>
        <script src="/static/scripts/attraction.js"></script>
    </body>
</html>
