<!DOCTYPE html>
<html lang="zh-TW">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="/static/styles/index.css?v=1.0">
        <link rel="stylesheet" href="/static/styles/dialog.css?v=1.0">
        <link rel="stylesheet" href="/static/styles/booking.css?v=1.0">
        <title>預定行程 - 台北一日遊</title>
    </head>
    <body>
        <header class="header">
            <div class="header__inner">
                <a class="logo" href="/">台北一日遊</a>
                <nav class="nav">
                    <a class="nav__link" href="/booking">預定行程</a>
                    <a class="nav__link" id="auth-entry" href="#">登入/註冊</a>
                </nav>
            </div>
        </header>

        <main class="main">
            <div class="main__inner">
                <h1 class="greeting">您好，<span id="member-name"></span>，待預訂的行程如下：</h1>

                <div id="booking-content" hidden>
                    <section class="trip">
                        <img class="trip__image" id="trip-image" src="" alt="">
                        <div class="trip__info">
                            <h2 class="trip__title" id="trip-title"></h2>
                            <p class="trip__row"><span class="trip__label">日期：</span><span class="trip__value" id="trip-date"></span></p>
                            <p class="trip__row"><span class="trip__label">時間：</span><span class="trip__value" id="trip-time"></span></p>
                            <p class="trip__row"><span class="trip__label">費用：</span><span class="trip__value" id="trip-price"></span></p>
                            <p class="trip__row"><span class="trip__label">地點：</span><span class="trip__value" id="trip-address"></span></p>
                        </div>
                        <button class="trip__delete" id="trip-delete" type="button" aria-label="刪除此預定行程">
                            <img src="/static/images/icon_delete.png" alt="">
                        </button>
                    </section>

                    <hr class="separator">

                    <section class="contact">
                        <h2 class="section__title">您的聯絡資訊</h2>
                        <div class="field">
                            <label class="field__label" for="contact-name">聯絡姓名：</label>
                            <input class="field__input" id="contact-name" type="text">
                        </div>
                        <div class="field">
                            <label class="field__label" for="contact-email">連絡信箱：</label>
                            <input class="field__input" id="contact-email" type="email">
                        </div>
                        <div class="field">
                            <label class="field__label" for="contact-phone">手機號碼：</label>
                            <input class="field__input" id="contact-phone" type="tel">
                        </div>
                        <p class="contact__notice">請保持手機暢通，準時到達，導覽人員將用手機與您聯繫，務必留下正確的聯絡方式。</p>
                    </section>

                    <hr class="separator">

                    <section class="payment">
                        <h2 class="section__title">信用卡付款資訊</h2>
                        <div class="field">
                            <label class="field__label" for="card-number">卡片號碼：</label>
                            <input class="field__input" id="card-number" type="text" placeholder="**** **** **** ****">
                        </div>
                        <div class="field">
                            <label class="field__label" for="card-expiration">過期時間：</label>
                            <input class="field__input" id="card-expiration" type="text" placeholder="MM / YY">
                        </div>
                        <div class="field">
                            <label class="field__label" for="card-cvv">驗證密碼：</label>
                            <input class="field__input" id="card-cvv" type="text" placeholder="CVV">
                        </div>
                    </section>

                    <hr class="separator">

                    <section class="confirm">
                        <p class="confirm__total">總價：新台幣 <span id="total-price"></span> 元</p>
                        <button class="confirm__submit" id="confirm-submit" type="button">確認訂購並付款</button>
                    </section>
                </div>

                <p class="empty" id="empty-state" hidden>沒有預訂行程</p>
            </div>
        </main>

        <footer class="footer">
            <p class="footer__text">COPYRIGHT © 2021 台北一日遊</p>
        </footer>

        <div class="dialog-overlay" id="auth-dialog">
            <div class="dialog-overlay__backdrop" data-dialog-close></div>
            <div class="dialog" role="dialog" aria-modal="true">
                <div class="dialog__bar"></div>
                <button class="dialog__close" type="button" data-dialog-close aria-label="關閉">✕</button>

                <div class="dialog__main">
                    <div id="signin-panel">
                        <h2 class="dialog__title">登入會員帳號</h2>
                        <div class="dialog__form">
                            <input class="dialog__input" id="signin-email" type="email" placeholder="輸入電子信箱" autocomplete="email">
                            <input class="dialog__input" id="signin-password" type="password" placeholder="輸入密碼" autocomplete="current-password">
                            <button class="dialog__submit" id="signin-submit" type="button">登入帳戶</button>
                        </div>
                        <p class="dialog__message" id="signin-message" hidden></p>
                        <p class="dialog__switch">還沒有帳戶？<span class="dialog__switch-link" id="to-signup">點此註冊</span></p>
                    </div>

                    <div id="signup-panel" hidden>
                        <h2 class="dialog__title">註冊會員帳號</h2>
                        <div class="dialog__form">
                            <input class="dialog__input" id="signup-name" type="text" placeholder="輸入姓名" autocomplete="name">
                            <input class="dialog__input" id="signup-email" type="email" placeholder="輸入電子郵件" autocomplete="email">
                            <input class="dialog__input" id="signup-password" type="password" placeholder="輸入密碼" autocomplete="new-password">
                            <button class="dialog__submit" id="signup-submit" type="button">註冊新帳戶</button>
                        </div>
                        <p class="dialog__message" id="signup-message" hidden></p>
                        <p class="dialog__switch">已經有帳戶了？<span class="dialog__switch-link" id="to-signin">點此登入</span></p>
                    </div>
                </div>
            </div>
        </div>
        <script src="/static/scripts/auth.js?v=2.0"></script>
        <script src="/static/scripts/booking.js?v=1.0"></script>
    </body>
</html>
